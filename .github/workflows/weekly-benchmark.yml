name: Weekly Performance Benchmark

on:
  schedule:
    # Run every Monday at 08:23 UTC (~09:23 UK BST / 08:23 GMT)
    - cron: '23 8 * * 1'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  benchmark:
    name: Run Database Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Performance Benchmark
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run benchmark
